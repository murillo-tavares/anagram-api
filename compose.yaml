services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anagram
      POSTGRES_USER: anagram
      POSTGRES_PASSWORD: anagram
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anagram -d anagram"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/anagram
      SPRING_DATASOURCE_USERNAME: anagram
      SPRING_DATASOURCE_PASSWORD: anagram
      FREEAPI_ANAGRAM_PROVIDER_BASE_URL: https://anagram.freeapi.me
    ports:
      - "8080:8080"

volumes:
  postgres-data:
