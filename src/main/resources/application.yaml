server:
  port: ${PORT:8080}

spring:
  application:
    name: anagram-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/anagram}
    username: ${PGUSER:anagram}
    password: ${PGPASSWORD:anagram}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

scalar:
  enabled: true
  path: /scalar
  url: /openapi.yaml
  hide-models: true
  hide-search: true
  hide-client-button: true
  page-title: Anagram Arena API Playground
  theme: deep-space
  dark-mode: true
  layout: modern
  custom-css: |
    :root {
      --scalar-font: "Trebuchet MS", "Segoe UI", sans-serif;
      --scalar-background-1: #0b1020;
      --scalar-background-2: #121b36;
      --scalar-color-1: #f8f5ec;
      --scalar-color-2: #d7f3ff;
      --scalar-sidebar-color-active: #ffd27a;
    }

freeapi-anagram-provider:
  base-url: ${FREEAPI_ANAGRAM_PROVIDER_BASE_URL:https://anagram.freeapi.me}
